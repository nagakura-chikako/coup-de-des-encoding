# Blank issues must stay enabled: the level-0 correction form is
# deliberately narrow, and readings, questions, later-layer
# proposals, and things a reader suspects but cannot yet show all
# need somewhere to go. An open question is part of the record here,
# not a defect in it.
blank_issues_enabled: true

